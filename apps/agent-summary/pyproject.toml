[project]
name = "agent-summary"
version = "0.1.0"
description = "Ruling Radar — Bundesgerichtsurteile bilingual house-style summary agent (MAF + Foundry invocations)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agent-framework>=0.1.0",
    "agent-framework-foundry-hosting>=0.1.0",
    "azure-identity>=1.19",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.scripts]
agent-summary-dev = "agent_summary.dev:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_summary"]

[tool.uv]
prerelease = "allow"

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]
